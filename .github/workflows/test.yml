name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make test

  qemu-boot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm xorriso qemu-system-x86

      - name: Build ISO
        run: make

      - name: QEMU headless boot + serial assert
        run: ./scripts/qemu-boot-smoke.sh
